name: Windows Server RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable RDP & Set Password
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user Administrator Password12345! /add
        net localgroup Administrators Administrator /add

    - name: Setup & Run Playit
      run: |
        Invoke-WebRequest https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64.exe -OutFile playit.exe
        .\playit.exe
