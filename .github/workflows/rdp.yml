name: Windows RDP Simple

on: workflow_dispatch

jobs:
  rdp:
    runs-on: windows-latest
    steps:
    - name: Enable RDP & Setup
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user Administrator Password12345! /add
        net localgroup Administrators Administrator /add

    - name: Start Tunnel & Get IP
      run: |
        choco install ngrok -y
        ngrok config add-authtoken 3HT6fj5BbbcElusUSXCRmJwbPc_3CueV8dV4Kat65
        Start-Process -NoNewWindow ngrok -ArgumentList "tcp 3389"
        Start-Sleep -Seconds 7
        $tunnels = (Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels").tunnels
        Write-Host "=================================================="
        Write-Host "RDP Address: $($tunnels.public_url)" -ForegroundColor Green
        Write-Host "Username: Administrator"
        Write-Host "Password: Password12345!"
        Write-Host "=================================================="
        Start-Sleep -Seconds 21600
